[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visium-hd-workflow"
version = "0.1.0"
description = "Reusable Python workflow for 10x Genomics Visium HD"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cluster_gpu", "run_spaceranger"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["visium_hd_workflow*"]
